name: Build arm64 Debug (Custom Xray-core)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2rayNG
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout custom Xray-core (public)
        uses: actions/checkout@v4
        with:
          repository: devwak/Xray-core
          ref: main                    # ← 改成你想要的 commit（或 main）
          path: Xray-core
          fetch-depth: 0

      - name: Set up Go 1.27.3
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'             # 强制使用 1.27.3（修复印度证书问题）

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build custom libv2ray.aar (arm64 only)
        run: |
          cd AndroidLibXrayLite
          
          # 重新初始化并强制指向你的魔改 core
          rm -f go.mod go.sum
          go mod init github.com/2dust/AndroidLibXrayLite
          
          # 使用本地的魔改 Xray-core（公共仓库已克隆）
          go mod edit -replace github.com/xtls/xray-core=../Xray-core
          
          # 你的 core 已经有本地 replace，这里再保险加一次（可选）
          go mod edit -replace github.com/apernet/quic-go=../Xray-core/my-quic-go_v0.63.0_magic
          go mod edit -replace github.com/quic-go/qpack=../Xray-core/my-qpack_v0.6.0
          go mod edit -replace github.com/hy2normal/quic-go=../Xray-core/my-quic-go_v0.63.0_normal_myNoChrome
          
          go mod tidy -v
          
          # 生成 geoip / geosite
          bash gen_assets.sh download || true
          mkdir -p assets
          cp -v data/*.dat assets/ 2>/dev/null || true
          
          # 只编译 arm64
          gomobile bind -v \
            -androidapi 24 \
            -target=android/arm64 \
            -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            ./
          
          # 复制到 v2rayNG 需要的位置
          mkdir -p ../V2rayNG/app/libs
          cp -v libv2ray.aar ../V2rayNG/app/libs/
          ls -lh ../V2rayNG/app/libs/libv2ray.aar

      - name: Build Debug APK (arm64 only)
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          
          ./gradlew clean
          # 强制只打 arm64-v8a Debug（使用 debug 签名）
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-arm64-debug-custom-core
          path: |
            V2rayNG/app/build/outputs/apk/debug/*arm64*.apk
            V2rayNG/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
