name: Build arm64 Debug (Custom Xray-core)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2rayNG
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout custom Xray-core
        uses: actions/checkout@v4
        with:
          repository: devwak/Xray-core
          ref: main                    # 或者改成你想要的 commit，例如 315e17b
          path: Xray-core
          fetch-depth: 0
          # 如果仓库是私有的，需要加 token：
          # token: ${{ secrets.GH_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'         # 建议用 1.25 或 1.24，1.27 可能太新

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" || sdkmanager --install "ndk;27.0.12077973" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk | head -1)" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build custom libv2ray.aar (arm64 only)
        run: |
          cd AndroidLibXrayLite
          
          # 清理并重新初始化
          rm -f go.mod go.sum
          go mod init github.com/2dust/AndroidLibXrayLite
          
          # 强制使用你的魔改核心
          go mod edit -replace github.com/xtls/xray-core=../Xray-core
          
          # 你的本地 replace（确保生效）
          go mod edit -replace github.com/apernet/quic-go=../Xray-core/my-quic-go_v0.63.0_magic
          go mod edit -replace github.com/quic-go/qpack=../Xray-core/my-qpack_v0.6.0
          go mod edit -replace github.com/hy2normal/quic-go=../Xray-core/my-quic-go_v0.63.0_normal_myNoChrome
          
          go mod tidy -v
          
          # 生成 assets（geoip/geosite）
          bash gen_assets.sh download || true
          mkdir -p assets
          cp -v data/*.dat assets/ 2>/dev/null || true
          
          # 只编译 arm64
          gomobile bind -v \
            -androidapi 24 \
            -target=android/arm64 \
            -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            ./
          
          # 复制 aar
          mkdir -p ../V2rayNG/app/libs
          cp -v libv2ray.aar ../V2rayNG/app/libs/
          ls -lh ../V2rayNG/app/libs/libv2ray.aar

      # 可选：编译 hev-socks5-tunnel（如果官方构建需要）
      - name: Build hev-socks5-tunnel (optional but recommended)
        run: |
          if [ -f compile-hevtun.sh ]; then
            bash compile-hevtun.sh || true
            cp -r libs V2rayNG/app/ 2>/dev/null || true
          fi

      - name: Build Debug APK (arm64 only)
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          
          ./gradlew clean
          
          # 正确方式：使用 ABI_FILTERS 只打 arm64-v8a Debug
          ./gradlew assembleDebug -PABI_FILTERS=arm64-v8a
          
          # 调试：列出所有生成的 APK
          echo "========== 生成的 APK 文件 =========="
          find app/build/outputs/apk -name "*.apk" -type f || true
          ls -lhR app/build/outputs/apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-arm64-debug-custom-core
          path: |
            V2rayNG/app/build/outputs/apk/**/debug/*.apk
            V2rayNG/app/build/outputs/apk/**/*arm64*.apk
            V2rayNG/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
